<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coderspedia: Color Palette</title>
</head>
<body>
    <div class="app">
        <div class="card">
            <h1>Color Palette</h1>
            <div class="colorBox"></div>
            <div class="hex">#FFFFFF</div>
            <div class="controls">
                <button>Generate Color</button>
                <button class="secondary">Copy HEX</button>
                <button class="secondary">Lock</button>
            </div>
            <div class="note">
                Click "Generate Color" or press <strong>G</strong>. Press 
                <strong>C</strong> to copy the hex.
            </div>
        </div>
    </div>
</body>
</html>
